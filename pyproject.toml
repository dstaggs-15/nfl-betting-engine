[project]
name = "nfl-betting-engine"
version = "0.1.0"
description = "Auditable NFL prop research and paper prediction analytics"
requires-python = ">=3.12"
dependencies = ["nflreadpy==0.1.5", "polars>=1.35,<2", "pydantic>=2.12,<3", "numpy>=2.2,<3", "scipy>=1.15,<2", "httpx>=0.28,<1", "scikit-learn>=1.6,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "playwright>=1.55,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
